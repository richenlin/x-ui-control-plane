{{define "head"}}
<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ .base_path }}assets/img/favicon.svg?{{ .cur_ver }}">
    <meta name="theme-color" content="#070a0b">
    <meta name="color-scheme" content="dark">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ .base_path }}assets/fonts/ibm-plex-sans-var.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="{{ .base_path }}assets/fonts/saira-semi-condensed-600.woff2">
    <link rel="stylesheet" href="{{ .base_path }}assets/ant-design-vue@1.7.2/antd.min.css">
    <link rel="stylesheet" href="{{ .base_path }}assets/element-ui@2.15.0/theme-chalk/display.css">
    <link rel="stylesheet" href="{{ .base_path }}assets/css/theme.css?{{ .cur_ver }}&theme=3">
    <link rel="stylesheet" href="{{ .base_path }}assets/css/custom.css?{{ .cur_ver }}&theme=3">
    <style>
        [v-cloak] {
            display: none;
        }
    </style>
    <title>{{.title}}</title>
</head>
{{end}}
